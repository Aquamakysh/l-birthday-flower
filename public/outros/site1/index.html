<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Poem - Floral Harmony</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }
        .floating {
            animation: float 6s ease-in-out infinite;
        }
        .hummingbird-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: dash 8s linear forwards infinite;
        }
        @keyframes dash {
            to {
                stroke-dashoffset: 0;
            }
        }
        .bloom {
            animation: bloom 4s ease-out forwards;
        }
        @keyframes bloom {
            0% {
                transform: scale(0.8);
                opacity: 0.7;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-b from-pink-50 to-purple-50 min-h-screen font-serif">
    <div class="container mx-auto px-4 py-12 relative overflow-hidden">
        <!-- Background floral elements -->
        <div class="absolute top-0 left-0 w-full h-full pointer-events-none">
            <!-- Large left flower -->
            <svg class="absolute left-0 top-1/4 w-32 h-32 text-pink-200 opacity-70 bloom" viewBox="0 0 100 100">
                <path d="M50 15 L60 40 L85 40 L65 55 L75 80 L50 65 L25 80 L35 55 L15 40 L40 40 Z" fill="currentColor"/>
            </svg>
            
            <!-- Right flower cluster -->
            <svg class="absolute right-0 top-1/3 w-40 h-40 text-purple-200 opacity-60 bloom" viewBox="0 0 100 100">
                <circle cx="30" cy="30" r="15" fill="currentColor"/>
                <circle cx="60" cy="30" r="15" fill="currentColor"/>
                <circle cx="45" cy="55" r="15" fill="currentColor"/>
                <circle cx="30" cy="80" r="15" fill="currentColor"/>
                <circle cx="60" cy="80" r="15" fill="currentColor"/>
            </svg>
            
            <!-- Bottom left small flowers -->
            <svg class="absolute left-10 bottom-20 w-20 h-20 text-rose-200 opacity-80 bloom" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="8"/>
                <circle cx="50" cy="50" r="20" fill="currentColor"/>
            </svg>
            
            <!-- Hummingbird flying path -->
            <svg class="absolute top-0 left-0 w-full h-full" viewBox="0 0 1000 600">
                <path id="flight-path" d="M-50,150 C100,50 300,250 500,200 C700,150 850,300 1050,250" fill="none" stroke="transparent"/>
                
                <g class="floating" transform="translate(200,100)">
                    <svg x="0" y="0" width="60" height="60" viewBox="0 0 100 100" class="hummingbird">
                        <!-- Hummingbird body -->
                        <path d="M50 30 Q60 20 70 30 Q80 40 70 50 Q60 60 50 50 Q40 60 30 50 Q20 40 30 30 Q40 20 50 30 Z" fill="#4A5568"/>
                        <!-- Beak -->
                        <path d="M70 30 L90 25 L85 35 Z" fill="#E53E3E"/>
                        <!-- Wing -->
                        <path d="M45 35 Q60 15 65 40 Q70 30 55 50 Z" fill="#2D3748" opacity="0.8"/>
                        <path d="M45 45 Q60 25 65 50 Q70 40 55 60 Z" fill="#2D3748" opacity="0.6"/>
                        <!-- Tail -->
                        <path d="M30 50 L20 60 L15 40 L10 70 Z" fill="#4A5568"/>
                    </svg>
                </g>
            </svg>
        </div>
        
        <!-- Main content -->
        <div class="relative z-10 max-w-2xl mx-auto bg-white bg-opacity-70 backdrop-blur-sm rounded-xl shadow-lg p-8 md:p-12">
            <h1 class="text-3xl md:text-4xl font-bold text-center text-purple-900 mb-8">Whispers of the Garden</h1>
            
            <div class="space-y-8 text-center">
                <!-- Poem lines with floral decorations -->
                <div class="relative">
                    <svg class="w-8 h-8 text-pink-400 absolute -left-4 -top-2" viewBox="0 0 100 100">
                        <path d="M50 20 L60 40 L80 40 L65 55 L75 80 L50 65 L25 80 L35 55 L20 40 L40 40 Z" fill="currentColor"/>
                    </svg>
                    <p class="text-xl md:text-2xl text-gray-800 italic">Like petals dancing on summer's breath,</p>
                </div>
                
                <div class="relative">
                    <svg class="w-6 h-6 text-purple-400 absolute -right-4 -top-1" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="8"/>
                        <circle cx="50" cy="50" r="20" fill="currentColor"/>
                    </svg>
                    <p class="text-xl md:text-2xl text-gray-800 italic">Our love blooms where hummingbirds nest,</p>
                </div>
                
                <div class="relative">
                    <svg class="w-10 h-10 text-rose-300 absolute -left-6 -bottom-4" viewBox="0 0 100 100">
                        <path d="M50 10 Q60 30 80 30 Q85 50 70 60 Q80 80 50 70 Q20 80 30 60 Q15 50 20 30 Q40 30 50 10 Z" fill="currentColor"/>
                    </svg>
                    <p class="text-xl md:text-2xl text-gray-800 italic">Nectar sweet in twilight's glow,</p>
                </div>
                
                <div class="relative">
                    <svg class="w-7 h-7 text-blue-400 absolute -right-5 -bottom-3" viewBox="0 0 100 100">
                        <path d="M50 10 L60 25 L75 20 L65 35 L80 40 L60 45 L50 60 L40 45 L20 40 L35 35 L25 20 L40 25 Z" fill="currentColor"/>
                    </svg>
                    <p class="text-xl md:text-2xl text-gray-800 italic">Forever more our hearts will know.</p>
                </div>
            </div>
            
            <!-- Interactive hummingbird button -->
            <div class="mt-12 text-center">
                <button id="hummingbird-btn" class="inline-flex items-center px-6 py-3 bg-gradient-to-r from-purple-400 to-pink-400 text-white rounded-full shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105">
                    <svg class="w-6 h-6 mr-2" viewBox="0 0 100 100">
                        <path d="M50 30 Q60 20 70 30 Q80 40 70 50 Q60 60 50 50 Q40 60 30 50 Q20 40 30 30 Q40 20 50 30 Z" fill="white"/>
                        <path d="M70 30 L90 25 L85 35 Z" fill="#FEB2B2"/>
                    </svg>
                    Send This Poem
                </button>
            </div>
        </div>
        
        <!-- Additional floating flowers -->
        <div class="absolute bottom-10 right-10 w-24 h-24 text-yellow-200 opacity-60 floating">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="8"/>
                <circle cx="50" cy="50" r="20" fill="currentColor"/>
            </svg>
        </div>
        
        <div class="absolute top-1/3 left-1/4 w-16 h-16 text-blue-200 opacity-50 floating" style="animation-delay: 2s;">
            <svg viewBox="0 0 100 100">
                <path d="M50 10 L60 25 L75 20 L65 35 L80 40 L60 45 L50 60 L40 45 L20 40 L35 35 L25 20 L40 25 Z" fill="currentColor"/>
            </svg>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Animate hummingbird along path
            const path = document.getElementById('flight-path');
            const pathLength = path.getTotalLength();
            
            // Set initial position
            path.style.strokeDasharray = pathLength;
            path.style.strokeDashoffset = pathLength;
            
            // Button interaction
            const btn = document.getElementById('hummingbird-btn');
            btn.addEventListener('click', function() {
                alert('Your romantic poem is ready to be shared! Imagine it carried by hummingbirds to your loved one.');
            });
            
            // Add some random floating flowers on click
            document.body.addEventListener('click', function(e) {
                if(e.target === btn) return;
                
                const colors = ['text-pink-200', 'text-purple-200', 'text-yellow-200', 'text-blue-200'];
                const flowerTypes = [
                    '<path d="M50 15 L60 40 L85 40 L65 55 L75 80 L50 65 L25 80 L35 55 L15 40 L40 40 Z" fill="currentColor"/>',
                    '<circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="8"/><circle cx="50" cy="50" r="20" fill="currentColor"/>',
                    '<path d="M50 10 Q60 30 80 30 Q85 50 70 60 Q80 80 50 70 Q20 80 30 60 Q15 50 20 30 Q40 30 50 10 Z" fill="currentColor"/>'
                ];
                
                const flower = document.createElement('div');
                flower.className = `absolute ${colors[Math.floor(Math.random() * colors.length)]} opacity-70 w-12 h-12 floating`;
                flower.style.left = `${e.clientX}px`;
                flower.style.top = `${e.clientY}px`;
                flower.style.animationDuration = `${4 + Math.random() * 4}s`;
                flower.innerHTML = `<svg viewBox="0 0 100 100">${flowerTypes[Math.floor(Math.random() * flowerTypes.length)]}</svg>`;
                
                document.querySelector('.container').appendChild(flower);
                
                // Remove after animation
                setTimeout(() => {
                    flower.remove();
                }, 8000);
            });
        });
    </script>
</body>
</html>
