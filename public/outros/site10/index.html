<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosa Turquesa Interativa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .falling-petal {
            animation: fallAndFade 3s ease-in forwards;
            transform-origin: center;
        }
        
        @keyframes fallAndFade {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(calc(var(--random-x) * 10px), 300px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-b from-blue-50 to-purple-50 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-teal-600 mb-2">Rosa Turquesa Interativa</h1>
        <p class="text-gray-600">Clique em qualquer pétala para vê-la transformar-se</p>
    </div>
    
    <div class="relative w-full max-w-md h-96 flex items-center justify-center">
        <svg id="flower" viewBox="0 0 200 200" class="w-full h-full">
            <!-- Center of the flower -->
            <circle cx="100" cy="100" r="15" fill="#F9A825" />
            
            <!-- Petals -->
            <path id="petal1" class="petal cursor-pointer hover:opacity-90 transition-opacity" d="M100,50 C120,60 120,90 100,100 C80,90 80,60 100,50" fill="#40E0D0" />
            <path id="petal2" class="petal cursor-pointer hover:opacity-90 transition-opacity" d="M150,100 C140,80 110,80 100,100 C110,120 140,120 150,100" fill="#40E0D0" />
            <path id="petal3" class="petal cursor-pointer hover:opacity-90 transition-opacity" d="M100,150 C80,140 80,110 100,100 C120,110 120,140 100,150" fill="#40E0D0" />
            <path id="petal4" class="petal cursor-pointer hover:opacity-90 transition-opacity" d="M50,100 C60,120 90,120 100,100 C90,80 60,80 50,100" fill="#40E0D0" />
            
            <!-- Inner petals rotated 45 degrees -->
            <path id="petal5" class="petal cursor-pointer hover:opacity-90 transition-opacity" d="M100,50 C120,60 120,90 100,100 C80,90 80,60 100,50" fill="#40E0D0" transform="rotate(45, 100, 100)" />
            <path id="petal6" class="petal cursor-pointer hover:opacity-90 transition-opacity" d="M100,50 C120,60 120,90 100,100 C80,90 80,60 100,50" fill="#40E0D0" transform="rotate(-45, 100, 100)" />
            <path id="petal7" class="petal cursor-pointer hover:opacity-90 transition-opacity" d="M100,50 C120,60 120,90 100,100 C80,90 80,60 100,50" fill="#40E0D0" transform="rotate(135, 100, 100)" />
            <path id="petal8" class="petal cursor-pointer hover:opacity-90 transition-opacity" d="M100,50 C120,60 120,90 100,100 C80,90 80,60 100,50" fill="#40E0D0" transform="rotate(-135, 100, 100)" />
        </svg>
    </div>
    
    <div class="mt-8 text-center">
        <p class="text-gray-600">Clique nas pétalas para ver a animação</p>
    </div>

    <script>
        document.querySelectorAll('.petal').forEach(petal => {
            petal.addEventListener('click', function(e) {
                // Create a clone of the clicked petal
                const clone = this.cloneNode(true);
                clone.id = 'falling-' + this.id;
                clone.classList.add('falling-petal');
                
                // Set random direction for falling
                const randomX = Math.random() > 0.5 ? 1 : -1;
                clone.style.setProperty('--random-x', randomX);
                
                // Add the clone to the SVG
                document.getElementById('flower').appendChild(clone);
                
                // Change the original petal color to red
                this.setAttribute('fill', '#FF0000');
                
                // Remove the clone after animation completes
                setTimeout(() => {
                    clone.remove();
                }, 3000);
            });
        });
    </script>
</body>
</html>
